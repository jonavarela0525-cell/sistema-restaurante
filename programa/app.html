<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sistema del Restaurante</title>
<meta name="theme-color" content="#faf7f2">
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#2a2420;--mute:#7a6f66;--line:#ece4da;--acc:#c2410c;--acc2:#fff1e8;--ok:#15803d;--okb:#e8f6ec;--bad:#b91c1c;--badb:#fdecec;--warn:#a16207;--warnb:#fdf6e3}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:80px;-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;background:var(--bg);padding:12px 16px 8px;z-index:5;border-bottom:1px solid var(--line)}
header h1{font-size:18px;margin:0}
#status:empty{display:none}
#status{margin-top:6px;display:flex;flex-direction:column;gap:4px}
.banner{font-size:13px;padding:6px 10px;border-radius:8px}
.banner.w{background:var(--warnb);color:var(--warn)}
.banner.b{background:var(--badb);color:var(--bad)}
main{padding:12px 16px;max-width:1100px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;border:0;background:none;padding:8px 2px 10px;font-size:11px;color:var(--mute);cursor:pointer;position:relative}
nav button.on{color:var(--acc);font-weight:700}
nav .i{display:block;font-size:20px;line-height:1.3}
nav .dot{position:absolute;top:4px;right:calc(50% - 18px);background:var(--bad);color:#fff;border-radius:99px;font-size:10px;padding:0 5px;font-weight:700}
h2{font-size:17px;margin:4px 0 12px}
h3{font-size:15px;margin:16px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;font-size:15px;font-weight:600;color:var(--ink);cursor:pointer;font-family:inherit}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.d{color:var(--bad)}
.btn.full{width:100%}
.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:#fff;color:var(--ink);font-family:inherit}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
.row{display:flex;gap:8px;align-items:center}
.wrap{flex-wrap:wrap}
.sp{flex:1}
.mute{color:var(--mute);font-size:13px}
.r{text-align:right}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600}
.pill.ok{background:var(--okb);color:var(--ok)}
.pill.bad{background:var(--badb);color:var(--bad)}
.pill.w{background:var(--warnb);color:var(--warn)}
.pill.a{background:var(--acc2);color:var(--acc)}
.modal{position:fixed;inset:0;background:rgba(30,20,10,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal.hidden{display:none}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:18px}}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:90vw;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
.mesa{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;cursor:pointer;font-family:inherit;color:var(--ink);min-height:92px}
.mesa b{display:block;font-size:16px}
.mesa.oc{background:var(--acc2);border-color:#f5c7a9}
.list>.it{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.list>.it:last-child{border-bottom:0}
.click{cursor:pointer}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px}
.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-size:14px;cursor:pointer;font-family:inherit;color:var(--ink)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.plato{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left;cursor:pointer;font-family:inherit;color:var(--ink)}
.plato b{display:block;font-size:14px;margin-bottom:4px}
.plato.sin{opacity:.6;border-style:dashed}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:18px;cursor:pointer;color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}
.kpi span{font-size:12px;color:var(--mute)}
.kpi b{display:block;font-size:19px;margin-top:2px}
.bar{height:8px;background:var(--acc);border-radius:4px;min-width:2px}
.inv{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.45;background:#fffdf9;border:1px solid var(--line);border-radius:10px;padding:14px}
.inv table{width:100%;border-collapse:collapse}
.inv td{padding:2px 0;vertical-align:top}
.inv hr{border:0;border-top:1px dashed #bbb;margin:8px 0}
.inv .c{text-align:center}
.orden{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.orden>*{min-width:0}
@media(min-width:900px){.orden{grid-template-columns:1fr 1.2fr}}
.paybar{position:sticky;bottom:80px;background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;margin-top:12px}
.paybar .btn{border:0}
.empty{text-align:center;padding:30px 10px;color:var(--mute)}
.rec{display:grid;grid-template-columns:1fr 90px 36px;gap:6px;align-items:center;margin-bottom:6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.check{display:flex;align-items:center;gap:8px;margin-top:10px}
.check input{width:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td,table.t th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
table.t td.r{white-space:nowrap}
table.t th{font-size:12px;color:var(--mute);font-weight:600}
</style>
</head>
<body>
<header>
  <div class="row"><h1 id="titulo">Restaurante</h1><span class="sp"></span><span id="quien" class="mute"></span></div>
  <div id="status"></div>
</header>
<main id="view"></main>
<nav id="tabs"></nav>
<div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

function guardarToken(t){API.token=t||'';try{t?localStorage.setItem('rs_token',t):localStorage.removeItem('rs_token')}catch(e){}}
async function api(route,body,method){
  let r;
  try{r=await fetch('/api/'+route,{method:method||(body?'POST':'GET'),headers:{'Content-Type':'application/json','X-Token':API.token},body:body?JSON.stringify(body):undefined})}

    orderBy:(f,d)=>qref(col,filters,[f,d||'asc'],limit),
    limit:n=>qref(col,filters,orderBy,n),
    get:async()=>{const r=await api('op',{op:'query',col,filters,orderBy,limit});const docs=r.docs.map(d=>snapDoc(d.id,d.data));return {docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{fromCache:false,hasPendingWrites:false}}},
    onSnapshot:(next,error)=>escuchar(col,async()=>{try{next(await q.get())}catch(e){if(e.code!=='unavailable'&&error)error(e)}}),
    doc:id=>dref(col+'/'+(id||nid()))
  };return q}
function dref(path){
  const col=path.split('/').slice(0,-1).join('/');
  const d={id:path.split('/').pop(),path,
    get:async()=>{const r=await api('op',{op:'get',path});return snapDoc(d.id,r.exists?r.data:null)},
    set:data=>api('op',{op:'set',path,data}),
    update:data=>api('op',{op:'update',path,data}),
    delete:()=>api('op',{op:'delete',path}),
    onSnapshot:(next,error)=>escuchar(col,async()=>{try{next(await d.get())}catch(e){if(e.code!=='unavailable'&&error)error(e)}}),
    collection:c=>qref(path+'/'+c,[],null,null)};
  return d}

function calc(items){
  const by={0:0,15:0,18:0};
  (items||[]).forEach(it=>{const t=Number(it.tasa);const k=(t===15||t===18)?t:0;by[k]+=Number(it.precio)*Number(it.cant)});
  const g15=r2(by[15]/1.15),g18=r2(by[18]/1.18);
  return {exento:r2(by[0]),gravado15:g15,isv15:r2(by[15]-g15),gravado18:g18,isv18:r2(by[18]-g18),total:r2(by[0]+by[15]+by[18])};
}

function platoDisponible(p){return (p.receta||[]).every(r=>{const i=S.insumos[r.insumoId];return !i||Number(i.stock||0)>=Number(r.cantidad||0)})}

  if(conCAI&&n.fechaLimite&&hoy()>n.fechaLimite)throw new Error('La fecha límite de emisión del CAI ya venció. Actualiza el CAI en Ajustes.');
  const t=calc(items);const nro=await siguienteNumero(conCAI);
  const numero=conCAI?(n.prefijo||'')+String(nro).padStart(8,'0'):'INT-'+String(nro).padStart(6,'0');
  const ahora=new Date();

function facturaTexto(f){
  const e=f.emisor||{};const fe=new Date(f.fecha);const ln=[];
  ln.push(e.nombre||'Restaurante');if(e.razon)ln.push(e.razon);if(e.rtn)ln.push('RTN: '+e.rtn);if(e.direccion)ln.push(e.direccion);if(e.telefono)ln.push('Tel: '+e.telefono);
  ln.push('------------------------------');ln.push((f.fiscal?'FACTURA No. ':'COMPROBANTE INTERNO No. ')+f.numero);if(f.fiscal)ln.push('CAI: '+e.cai);if(f.anulada)ln.push('*** ANULADA ***');
  ln.push('Fecha: '+fe.toLocaleString('es-HN'));ln.push('Mesa: '+f.mesa);ln.push('Cliente: '+f.cliente);ln.push('RTN cliente: '+(f.rtn||'—'));ln.push('Condición: '+(f.metodo==='Crédito'?`CRÉDITO ${f.plazo} días · Vence: ${fechaCorta(f.vence)}`:'Contado'));ln.push('------------------------------');
  (f.items||[]).forEach(it=>ln.push(`${it.cant} x ${it.nombre}  ${L(it.precio*it.cant)}`));
  ln.push('------------------------------');
  ln.push('Importe exento: '+L(f.exento));ln.push('Gravado 15%: '+L(f.gravado15));ln.push('Gravado 18%: '+L(f.gravado18));ln.push('ISV 15%: '+L(f.isv15));ln.push('ISV 18%: '+L(f.isv18));
  if(f.servicio)ln.push(`Servicio ${f.servicioPct}%: `+L(f.servicio));ln.push('TOTAL: '+L(f.totalPagar));ln.push(f.metodo==='Crédito'?'Saldo pendiente: '+L(f.saldo):f.metodo+': '+L(f.recibido));if(f.metodo==='Efectivo')ln.push('Cambio: '+L(f.cambio));
  if(f.fiscal){ln.push('------------------------------');ln.push(`Rango autorizado: ${e.prefijo}${String(e.rangoDesde).padStart(8,'0')} al ${e.prefijo}${String(e.rangoHasta).padStart(8,'0')}`);ln.push('Fecha límite de emisión: '+(e.fechaLimite||'—'))}
  return ln.join('\n');
}

function lineasPendientes(m){const env=m.enviados||{};const out=[];const ks=new Set();
  (m.items||[]).forEach(it=>{if(it.cocina===false||!it.k)return;ks.add(it.k);const e=env[it.k];const c=Number((e&&e.c)||0);const d=Number(it.cant)-c;
    if(d>0)out.push({t:'nuevo',cant:d,nombre:it.nombre,nota:it.nota});else if(d<0)out.push({t:'anular',cant:-d,nombre:it.nombre});else if(e&&c>0&&(e.nota||'')!==(it.nota||''))out.push({t:'nota',nombre:it.nombre,nota:it.nota})});
  Object.entries(env).forEach(([k,v])=>{if(!ks.has(k)&&v&&v.c>0)out.push({t:'anular',cant:v.c,nombre:v.n})});return out}

  const env=m.enviados||{};const out=[];const ks=new Set();
  (m.items||[]).forEach(it=>{if(it.cocina===false||!it.k)return;ks.add(it.k);const e=env[it.k];const d=Number(it.cant)-Number((e&&e.c)||0);if(d!==0||(e&&e.c>0&&(e.nota||'')!==(it.nota||'')))out.push(it.k)});
  Object.entries(env).forEach(([k,v])=>{if(!ks.has(k)&&v&&v.c>0)out.push(k)});return out}

let vigilando=null;const enCurso=new Set();

function registrarAbono(id,monto,metodo){
  return serial('facturas/'+id,async()=>{
    const ref=S.db.doc('facturas/'+id);const s=await ref.get();if(!s.exists)throw new Error('No se encontró la factura');
    const f=s.data();if(f.anulada)throw new Error('La factura está anulada');
    const antes=r2(f.saldo);if(antes<=0)throw new Error('Este crédito ya está pagado');
    if(monto>antes+0.004)throw new Error('El abono es mayor que el saldo ('+L(antes)+')');
    const despues=r2(antes-monto);const ahora=new Date();const abId=nid();
    try{await ref.update({abonos:{[abId]:monto}});
      const ab={facturaId:id,numero:f.numero,cliente:f.cliente,monto,metodo,saldoAntes:antes,saldoDespues:despues,fecha:ahora.toISOString(),dia:fdia(ahora),por:S.uid||null,equipo:S.info.equipo||''};
      await S.db.doc('abonos/'+abId).set(ab);return ab}
    catch(e){if(e&&e.code)writeErr(e);throw e}
  });
}

function rango(modo){const d=new Date();if(modo==='hoy')return[hoy(),hoy()];if(modo==='7'){const a=new Date(d);a.setDate(a.getDate()-6);return[fdia(a),hoy()]}if(modo==='mes')return[fdia(new Date(d.getFullYear(),d.getMonth(),1)),hoy()];if(modo==='mesant'){return[fdia(new Date(d.getFullYear(),d.getMonth()-1,1)),fdia(new Date(d.getFullYear(),d.getMonth(),0))]}return[S.rep.desde,S.rep.hasta]}
async function cargarReporte(){
  if(!S.db)return;S.rep.cargando=true;
  try{const q=S.db.collection('facturas').where('dia','>=',S.rep.desde).where('dia','<=',S.rep.hasta).limit(1000);const s=await q.get();S.rep.data=s.docs.map(d=>({id:d.id,...d.data()}));
    const qa=await S.db.collection('abonos').where('dia','>=',S.rep.desde).where('dia','<=',S.rep.hasta).limit(1000).get();S.rep.abonos=qa.docs.map(d=>d.data())}
  catch(e){S.rep.data=[];toast('No se pudo cargar el reporte ('+(e.code||'error')+')')}

  if(S.rep.desde<=hoy()&&S.rep.hasta>=hoy()){try{const c=await S.db.doc('cierres/'+hoy()).get();S.cierreHoy=c.exists?c.data():null}catch(e){}}
  render();
}

async function subirLogo(file){
  S.dirty=false;if(!file)return;if(!/^image\//.test(file.type)){toast('Elige una imagen');return}
  try{
    const img=await new Promise((ok,mal)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=mal;i.src=URL.createObjectURL(file)});
    const L=420,c=document.createElement('canvas');c.width=L;c.height=L;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,L,L);
    const k=Math.min(L/img.width,L/img.height)*0.94,w=img.width*k,h=img.height*k;x.drawImage(img,(L-w)/2,(L-h)/2,w,h);
    const d=x.getImageData(0,0,L,L),a=d.data;for(let i=0;i<a.length;i+=4){const g=0.299*a[i]+0.587*a[i+1]+0.114*a[i+2];const v=g<150?0:255;a[i]=a[i+1]=a[i+2]=v;a[i+3]=255}x.putImageData(d,0,0);
    const data=c.toDataURL('image/png');if(data.length>400000){toast('La imagen es muy compleja; usa una más sencilla');return}
    await W('config/logo','set',{data,actualizado:new Date().toISOString()});toast('Logo actualizado');
  }catch(e){toast('No se pudo usar esa imagen')}
}

    case 'vaciar':if(!twoTap(b))break;cambiarItems(()=>[]);break;
    case 'clienteMesa':{const m=S.mesas[S.mesaAbierta];if(!m)break;openModal(`<h2>👤 ¿De quién es la orden? · ${esc(m.nombre)}</h2><input id="nC" value="${esc(m.cliente||'')}" placeholder="Ej. Carlos, familia López, Pedidos Ya #1234" maxlength="60"><p class="mute">Sale en el cuadro de la mesa, en la comanda de cocina y en la factura.</p><div class="row" style="margin-top:14px">${m.cliente?'<button class="btn d" data-x="q">Quitar</button>':''}<span class="sp"></span><button class="btn" data-x="c">Cancelar</button><button class="btn p" data-x="o">Guardar</button></div>`,sh=>{const id=S.mesaAbierta;const guardar=v=>{closeModal();mutate('mesas',id,()=>({cliente:v})).catch(()=>{})};sh.querySelector('[data-x=c]').onclick=closeModal;sh.querySelector('[data-x=o]').onclick=()=>guardar(sh.querySelector('#nC').value.trim().slice(0,60));const q=sh.querySelector('[data-x=q]');if(q)q.onclick=()=>guardar('');const inp=sh.querySelector('#nC');inp.focus();inp.addEventListener('keydown',e=>{if(e.key==='Enter')guardar(inp.value.trim().slice(0,60))})});break}
    case 'nota':{const it=(S.mesas[S.mesaAbierta].items||[]).find(i=>i.k===k);if(!it)break;openModal(`<h2>Nota · ${esc(it.nombre)}</h2><input id="nT" value="${esc(it.nota)}" placeholder="Ej. sin cebolla, término medio"><div class="row" style="margin-top:14px"><span class="sp"></span><button class="btn" data-x="c">Cancelar</button><button class="btn p" data-x="o">Guardar</button></div>`,sh=>{sh.querySelector('[data-x=c]').onclick=closeModal;sh.querySelector('[data-x=o]').onclick=()=>{const v=sh.querySelector('#nT').value.trim();closeModal();cambiarItems(items=>{const x=items.find(i=>i.k===k);if(!x)return null;x.nota=v;return items})}});break}
    case 'cobrar':abrirCobro();break;
    case 'comandaYa':confirmarComanda(S.mesaAbierta);break;
    case 'verCred':verCredito(id);break;
    case 'nuevoUsr':editarUsuario(null);break;
    case 'editUsr':editarUsuario(id);break;
    case 'prueba':mandarAImprimir({tipo:'prueba'});break;
    case 'updRevisar':{b.disabled=true;b.textContent='Buscando…';try{pintarUpd(await api('actualizacion',{accion:'revisar'}))}catch(e){toast(e.message)}b.disabled=false;b.textContent='Buscar actualización';break}
    case 'updInstalar':{if(!twoTap(b,'¿Instalar? El sistema se reiniciará unos segundos'))break;b.disabled=true;try{await api('actualizacion',{accion:'instalar'});toast('Instalando… el sistema se recargará solo')}catch(e){toast(e.message);b.disabled=false}break}
    case 'logoQuitar':{if(!twoTap(b))break;try{await W('config/logo','delete');toast('Se usa el logo original')}catch(e){}break}
    case 'syncConfig':formSync(false);break;
    case 'syncAhora':{b.disabled=true;b.textContent='Sincronizando…';try{S.info.sync=await api('sync',{accion:'ahora'})}catch(e){toast(e.message)}pintarSync();break}
    case 'syncQuitar':{if(!twoTap(b,'¿Desenlazar? Dejará de recibir cambios'))break;try{S.info.sync=await api('sync',{accion:'quitar'});toast('Desenlazada')}catch(e){toast(e.message)}pintarSync();break}
    case 'respaldar':{b.disabled=true;try{const r=await api('respaldo',{});toast('Respaldo creado: '+r.nombre);cargarRespaldos()}catch(e){toast(e.message)}b.disabled=false;break}
    case 'descargarDb':{try{const r=await fetch('/api/descargarRespaldo',{headers:{'X-Token':API.token}});if(!r.ok)throw new Error('No se pudo descargar');const nombre=(r.headers.get('Content-Disposition')||'').match(/filename="([^"]+)"/);await localDl.save({filename:nombre?nombre[1]:'restaurante.db',data:await r.blob()})}catch(e){toast(e.message)}break}
    case 'exportar':{try{const r=await fetch('/api/exportar',{headers:{'X-Token':API.token}});if(!r.ok)throw new Error('No se pudo exportar');const t=await r.text();await localDl.save({filename:'respaldo_restaurante_'+hoy()+'.json',data:t})}catch(e){toast(e.message)}break}
    case 'salir':{try{await api('salir',{})}catch(e){}guardarToken('');location.reload();break}
    case 'verF':{const f=S.facturasHoy.find(x=>x.id===id);if(f)verFactura(f);break}
    case 'nuevoPlato':editarPlato(null);break;
    case 'editPlato':editarPlato(id);break;
    case 'nuevoIns':if(S.isAdmin)editarInsumo(null);break;
    case 'editIns':if(S.isAdmin)editarInsumo(id);break;
    case 'entrada':if(S.isAdmin)entrada(id);break;
    case 'rmodo':{S.rep.modo=b.dataset.m;if(S.rep.modo!=='custom'){[S.rep.desde,S.rep.hasta]=rango(S.rep.modo);S.rep.data=null}render();break}
    case 'rAplicar':{const d=$('#rD').value,h=$('#rH').value;if(!d||!h||d>h){toast('Revisa las fechas');break}S.rep.desde=d;S.rep.hasta=h;S.rep.data=null;limpio();break}
    case 'csv':csv();break;
    case 'guardarCierre':{const fondo=num($('#cF').value),contado=num($('#cK').value),efe=num(b.dataset.efe);const esperado=r2(fondo+efe);
      b.disabled=true;try{const c={dia:hoy(),fondo:r2(fondo),ventasEfectivo:efe,esperado,contado:r2(contado),diferencia:r2(contado-esperado),notas:$('#cN').value.trim(),hora:new Date().toISOString(),por:S.uid||null};await W('cierres/'+hoy(),'set',c);S.cierreHoy=c;toast('Cierre guardado. Diferencia: '+L(c.diferencia));limpio()}catch(_){b.disabled=false}break}
    case 'guardarNeg':{const g=s=>$(s).value.trim();const d1=Math.floor(num(g('#a1'))),d2=Math.floor(num(g('#a2')));
      if((g('#aC')||d1||d2)&&!(g('#aC')&&d1&&d2&&d2>=d1)){toast('Para facturar con CAI llena CAI y un rango válido');break}
      const rtn=g('#aT').replace(/\D/g,'');if(rtn&&rtn.length!==14){toast('El RTN debe tener 14 dígitos');break}
      const data={nombre:g('#aN'),razon:g('#aR'),rtn,direccion:g('#aD'),telefono:g('#aF'),correo:g('#aE'),cai:g('#aC').toUpperCase(),prefijo:g('#aP'),rangoDesde:d1||'',rangoHasta:d2||'',fechaLimite:g('#aL'),servicioPct:num(g('#aS')),autoImprimir:$('#aAI').checked,comandas:$('#aCo').checked,comandaModo:$('#aCm').value,comandaSegundos:Math.max(0,Math.min(300,Math.floor(num(g('#aCs'))))),plazoCredito:Math.max(0,Math.floor(num(g('#aK')))),leyenda:g('#aY')};
      b.disabled=true;try{await W('config/negocio','set',data);toast('Datos guardados');limpio()}catch(_){b.disabled=false}break}
    case 'addMesa':{const v=$('#nuevaMesa').value.trim();if(!v){toast('Escribe un nombre');break}const max=Math.max(0,...Object.values(S.mesas).map(m=>Number(m.orden)||0).filter(x=>x<99));try{await W('mesas/'+nid(),'set',{nombre:v,orden:max+1,items:[],abiertaEn:null});limpio()}catch(_){}break}
    case 'delMesa':{const m=S.mesas[id];if((m.items||[]).length){toast('La mesa tiene una orden abierta');break}if(!twoTap(b))break;try{await W('mesas/'+id,'delete')}catch(_){}break}
  }
});
document.addEventListener('input',e=>{if(e.target.id!=='buscar'&&$('#view').contains(e.target))S.dirty=true;if(e.target.id==='buscar'){S.q=e.target.value;const g=$('#gridPlatos');if(g)g.innerHTML=gridPlatos(Object.values(S.platos).filter(p=>p.activo!==false).sort((a,b)=>String(a.nombre).localeCompare(b.nombre)))}});
document.addEventListener('change',e=>{if(e.target.id==='eqFactura'){S.dirty=false;const v=e.target.checked;api('equipo',{factura:v}).then(r=>{S.info.factura=r.factura;toast(v?'Esta computadora cobra y factura':'Esta computadora ya no factura');render()}).catch(er=>toast(er.message));return}if(e.target.id==='fRest2'){const f=e.target.files&&e.target.files[0];if(f){openModal(`<h2>¿Restaurar este respaldo?</h2><p>${esc(f.name)}</p><p>Todos los datos actuales de esta computadora se reemplazarán por los del respaldo. La base actual se guarda aparte.</p><div class="row"><span class="sp"></span><button class="btn" data-x="c">Cancelar</button><button class="btn p" data-x="o">Restaurar</button></div>`,sh=>{sh.querySelector('[data-x=c]').onclick=closeModal;sh.querySelector('[data-x=o]').onclick=()=>{closeModal();confirmarRestaurar=true;restaurarRespaldo(f,false)}})}e.target.value='';return}if(e.target.id==='logoFile'){subirLogo(e.target.files&&e.target.files[0]);return}
  if(e.target.id==='aLF'){S.dirty=false;W('config/negocio','update',{logoFactura:e.target.checked}).then(()=>toast('Guardado')).catch(()=>{});return}if(e.target.id==='esImp'){try{localStorage.setItem('rs_impresora',e.target.checked?'1':'0')}catch(_){}S.dirty=false;escucharImpresiones();vigilarComandas();toast(e.target.checked?'Este dispositivo imprimirá las facturas':'Este dispositivo ya no imprime');return}const m=e.target.dataset&&e.target.dataset.mesa;if(m){const v=e.target.value.trim();S.dirty=false;if(v&&S.mesas[m]&&v!==S.mesas[m].nombre)mutate('mesas',m,()=>({nombre:v})).catch(()=>{})}});

/* ---------- arranque ---------- */
function sub(name,ref,onData){
  let t=setTimeout(()=>{S.offline[name]=true;renderStatus()},10000);
  return ref.onSnapshot(snap=>{if(!snap.metadata.fromCache){clearTimeout(t);if(S.offline[name]){S.offline[name]=false}}S.loaded[name]=true;onData(snap);S.ready=READY.every(k=>S.loaded[k]);render()},
    err=>{clearTimeout(t);S.offline[name]=false;S.loaded[name]=true;S.ready=READY.every(k=>S.loaded[k]);toast('Error de conexión: '+(err&&err.code||''));render()});
}
S.loaded={};
const READY=['negocio','insumos','platos','mesas','facturas','abonos','creditos'];
let unsubHoy=null,unsubAb=null,diaSub=null;
function subHoy(){if(diaSub===hoy())return;diaSub=hoy();if(unsubHoy)unsubHoy();if(unsubAb)unsubAb();S.facturasHoy=[];S.abonosHoy=[];unsubAb=sub('abonos',S.db.collection('abonos').where('dia','==',diaSub),s=>{S.abonosHoy=s.docs.map(d=>d.data())});unsubHoy=sub('facturas',S.db.collection('facturas').where('dia','==',diaSub),s=>{S.facturasHoy=s.docs.map(d=>({id:d.id,...d.data()}))})}
function pantallaAcceso(setup,msg){
  S.pantalla=`<div class="card" style="max-width:380px;margin:30px auto"><div style="text-align:center">${logoImg('width:150px;height:150px;object-fit:contain')}</div><h2 style="text-align:center;margin-top:6px">${esc(S.info.nombreNegocio||'Sistema del Restaurante')}</h2>
   ${setup?'<p class="mute">Primera vez: crea la cuenta del <b>administrador</b> (dueño). Después podrás agregar a tu equipo en Ajustes.</p><label>Tu nombre</label><input id="lN" autocomplete="name">':''}
   <label>Usuario${setup?' (corto, para entrar; ej. jona)':''}</label><input id="lU" autocapitalize="off" autocomplete="username" placeholder="${setup?'ej. jona':''}">
   <label>PIN${setup?' (4 a 8 números)':''}</label><input id="lP" type="password" inputmode="numeric" autocomplete="${setup?'new-password':'current-password'}">
   ${setup?'<label>Repite el PIN</label><input id="lP2" type="password" inputmode="numeric">':''}
   <div id="lMsg" class="mute" style="color:var(--bad);min-height:20px;margin-top:8px">${esc(msg||'')}</div>
   <button class="btn p full" id="lGo">${setup?'Crear administrador':'Entrar'}</button>
   ${setup?`<div style="border-top:1px solid var(--line);margin-top:16px;padding-top:14px;text-align:center"><p class="mute" style="margin-top:0">¿El restaurante ya usa el sistema en otra computadora enlazada por GitHub?</p><button class="btn full" id="bEnlazar">🔗 Enlazar con el restaurante</button></div>
   <div style="border-top:1px solid var(--line);margin-top:16px;padding-top:14px;text-align:center"><p class="mute" style="margin-top:0">¿Ya usabas el sistema en otra computadora?</p><label class="btn full" style="display:block">📂 Restaurar un respaldo<input type="file" id="fRest" accept=".db" style="display:none"></label><p class="mute">Elige el archivo <b>restaurante_....db</b> (por ejemplo desde tu memoria USB o la carpeta "respaldos").</p></div>`:''}</div>`;
  render();
  const go=async()=>{const bt=$('#lGo');const u=$('#lU').value.trim(),p=$('#lP').value;const m=$('#lMsg');
    if(!u){m.textContent='Escribe el usuario';return}if(setup){if(!$('#lN').value.trim()){m.textContent='Escribe tu nombre';return}if(!/^\d{4,8}$/.test(p.trim())){m.textContent='El PIN debe tener de 4 a 8 números';return}if(p!==$('#lP2').value){m.textContent='Los PIN no coinciden';return}}
    bt.disabled=true;try{const r=await api(setup?'configurar':'entrar',setup?{nombre:$('#lN').value,usuario:u,pin:p}:{usuario:u,pin:p});guardarToken(r.token);S.yo=r.yo;S.pantalla=null;S.dirty=false;S.pending=false;if(document.activeElement)document.activeElement.blur();iniciar()}catch(e){m.textContent=e.message;bt.disabled=false}};
  $('#lGo').onclick=go;
  const be=$('#bEnlazar');if(be)be.onclick=()=>formSync(true);
  const fr=$('#fRest');if(fr)fr.onchange=()=>restaurarRespaldo(fr.files&&fr.files[0],true);$('#view').addEventListener('keydown',e=>{if(e.key==='Enter'&&S.pantalla)go()});
  setTimeout(()=>{const f=$(setup?'#lN':'#lU');if(f)f.focus()},50);
}
async function restaurarRespaldo(file,desdeInicio){
  if(!file)return;S.dirty=false;
  if(!/\.db$/i.test(file.name)){toast('Elige un archivo que termine en .db');return}
  if(!desdeInicio&&!confirmarRestaurar)return;
  S.pantalla=`<div class="card empty" style="max-width:420px;margin:30px auto"><p><b>Restaurando respaldo…</b></p><p>${esc(file.name)}</p><p class="mute">No cierres esta ventana.</p></div>`;render();
  let r;
  try{const res=await fetch('/api/restaurar',{method:'POST',headers:{'Content-Type':'application/octet-stream','X-Token':API.token},body:file});r=await res.json().catch(()=>({}));if(!res.ok)throw new Error(r.error||'No se pudo restaurar')}
  catch(e){S.pantalla=null;toast(e.message);if(desdeInicio)pantallaAcceso(true,e.message);else render();return}
  guardarToken('');
  S.pantalla=`<div class="card empty" style="max-width:420px;margin:30px auto"><p><b>✅ Respaldo cargado</b></p><p>${r.facturas} facturas · ${r.platos} platos · ${r.insumos} insumos · ${r.usuarios} usuarios</p><p class="mute" id="rMsg">${r.reinicioAutomatico?'Reiniciando el sistema…':'Cierra esta ventana y vuelve a abrir el sistema desde el icono del escritorio.'}</p></div>`;render();
  if(r.reinicioAutomatico){for(let i=0;i<40;i++){await sleep(1000);try{const x=await fetch('/api/estado');if(x.ok){location.reload();return}}catch(e){}}}
}
let confirmarRestaurar=false;
function confirmarComanda(mesaId){
  const m=S.mesas[mesaId];if(!m)return;const ls=lineasPendientes(m);if(!ls.length){toast('No hay nada nuevo para cocina');return}
  openModal(`<h2>🍳 Enviar a cocina · ${esc(m.nombre)}</h2><p class="mute" style="margin-top:-6px">Revisa la comanda antes de enviarla:</p>
   <div class="card" style="font-size:16px">${ls.map(l=>l.t==='nuevo'?`<div style="margin:6px 0"><b>${l.cant} x ${esc(l.nombre)}</b>${l.nota?`<div class="mute">→ ${esc(l.nota)}</div>`:''}</div>`
     :l.t==='anular'?`<div style="margin:6px 0;color:var(--bad)"><b>ANULAR ${l.cant} x ${esc(l.nombre)}</b></div>`
     :`<div style="margin:6px 0">Cambio de nota: <b>${esc(l.nombre)}</b><div class="mute">→ ${esc(l.nota||'(sin nota)')}</div></div>`).join('')}</div>
   <div class="row" style="margin-top:14px"><button class="btn" data-x="c">Seguir agregando</button><span class="sp"></span><button class="btn p" data-x="o">✅ Confirmar y enviar</button></div>`,
  sh=>{sh.querySelector('[data-x=c]').onclick=closeModal;sh.querySelector('[data-x=o]').onclick=async e=>{const bt=e.currentTarget;bt.disabled=true;
    try{const r=await api('comanda',{mesaId});closeModal();toast(r.ok?'Comanda enviada a cocina':'No hay nada nuevo para cocina')}catch(err){toast(err.message);bt.disabled=false}}});
}
function iniciar(){
  S.db=localDb;S.user=localUser;S.dl=localDl;S.uid=S.yo.id;S.isAdmin=S.yo.rol==='admin';S.canWrite=true;S.names[S.yo.id]=S.yo.nombre;
  $('#quien').innerHTML=`${esc(S.yo.nombre)} <span class="pill ${S.isAdmin?'a':'ok'}">${S.isAdmin?'Administrador':'Usuario'}</span> <button class="btn sm" data-act="salir" style="margin-left:6px">Salir</button>`;
  cargarUsuarios();conectarEventos();
  const db=S.db;
  db.doc('config/logo').onSnapshot(s=>{const d=s.exists&&s.data().data;S.logoPropio=d||null;try{d?localStorage.setItem('rs_logo',d):localStorage.removeItem('rs_logo')}catch(e){}render()});
  sub('negocio',db.doc('config/negocio'),s=>{S.negocio=s.exists?s.data():{};try{localStorage.setItem('rs_nombre',S.negocio.nombre||'')}catch(e){}});
  sub('insumos',db.collection('insumos'),s=>{S.insumos=Object.fromEntries(s.docs.map(d=>[d.id,{id:d.id,...d.data()}]))});
  sub('platos',db.collection('platos'),s=>{S.platos=Object.fromEntries(s.docs.map(d=>[d.id,{id:d.id,...d.data()}]))});
  sub('creditos',db.collection('facturas').where('creditoPendiente','==',true),s=>{S.creditos=s.docs.map(d=>({id:d.id,...d.data()}))});
  sub('mesas',db.collection('mesas'),s=>{S.mesas=Object.fromEntries(s.docs.map(d=>[d.id,{id:d.id,...d.data()}]))});
  subHoy();escucharImpresiones();vigilarComandas();
  setInterval(()=>{subHoy();if(S.tab==='mesas'&&!S.mesaAbierta)render()},60000);
  render();
}
S.usuarios=[];S.info={};
try{S.logoPropio=localStorage.getItem('rs_logo')||null}catch(e){}
try{S.info.nombreNegocio=localStorage.getItem('rs_nombre')||''}catch(e){}
render();
(async function arrancar(){
  let est;
  try{est=await api('estado')}catch(e){S.pantalla=`<div class="card empty" style="max-width:420px;margin:30px auto"><p><b>No se pudo conectar con el sistema.</b></p><p>Revisa que la computadora del restaurante esté encendida y con el sistema abierto, y que este dispositivo esté en el mismo WiFi.</p><button class="btn p" onclick="location.reload()">Reintentar</button></div>`;render();return}
  Object.assign(S.info,est);if(est.ahora)S.desfase=est.ahora-Date.now();
  if(est.uniendo&&!est.hayUsuarios){S.pantalla=`<div class="card empty" style="max-width:420px;margin:30px auto"><p><b>Descargando los datos del restaurante…</b></p><p class="mute">Esta computadora se está enlazando por internet. Espera un momento; se abrirá sola.</p></div>`;render();setTimeout(()=>location.reload(),5000);return}
  if(!est.hayUsuarios)return pantallaAcceso(true);
  if(!est.yo){guardarToken('');return pantallaAcceso(false)}
  S.yo=est.yo;iniciar();
})();
})();
</script>
